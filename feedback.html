<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Com estàs? · Manresa</title>
<meta name="theme-color" content="#11141a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11141a; --bg-raised:#181c24; --bg-raised-2:#1e2330;
    --line:#2a2f3a; --pink:#ff2d78; --pink-dim:#c21f5c;
    --text:#f2f1ee; --text-dim:#8b93a3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; min-height:100dvh;
    padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }
  .wrap{width:100%; max-width:460px; margin:0 auto;}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .back-btn{
    width:38px; height:38px; border-radius:10px;
    background:var(--bg-raised); border:1px solid var(--line);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    text-decoration:none; flex:0 0 auto;
  }
  .topbar h1{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:22px;
    text-transform:uppercase; letter-spacing:.01em; margin:0;
  }
  .step-label{
    font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--pink); margin:22px 0 10px;
  }
  .step-label:first-of-type{margin-top:6px;}
  select, input[type="date"]{
    width:100%; padding:14px 14px; border-radius:12px;
    background:var(--bg-raised); border:1px solid var(--line);
    color:var(--text); font-family:'Inter',sans-serif; font-size:15px;
  }
  input[type="date"]{color-scheme:dark;}

  .mood-grid{display:flex; justify-content:space-between; gap:8px; margin-top:4px;}
  .mood-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:14px 6px; border-radius:14px; background:var(--bg-raised);
    border:1px solid var(--line); cursor:pointer;
  }
  .mood-btn .emoji{font-size:28px; line-height:1;}
  .mood-btn .lbl{font-size:10.5px; color:var(--text-dim); text-align:center; line-height:1.2;}
  .mood-btn.selected{background:var(--pink); border-color:var(--pink);}
  .mood-btn.selected .lbl{color:#11141a; font-weight:600;}

  .btn{
    width:100%; padding:15px; border:none; border-radius:12px;
    font-family:'Oswald',sans-serif; font-weight:600; font-size:14px;
    letter-spacing:.06em; text-transform:uppercase; cursor:pointer; margin-top:26px;
  }
  .btn-primary{background:var(--pink); color:#11141a;}
  .btn-primary:disabled{background:var(--bg-raised-2); color:var(--text-dim);}

  .toast{
    position:fixed; left:20px; right:20px; bottom:28px; max-width:420px; margin:0 auto;
    background:var(--pink); color:#11141a; font-weight:600;
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.04em;
    text-align:center; padding:14px; border-radius:12px; display:none; text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="back-btn" aria-label="Enrere">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Com estàs?</h1>
  </div>

  <div class="step-label">Qui ets?</div>
  <select id="playerSelect">
    <option value="">Tria el teu nom</option>
    <option>0.Berta</option>
    <option>5.Sira</option>
    <option>8.Laia M</option>
    <option>11.Laia V</option>
    <option>12.Queralt</option>
    <option>16.Jana S.</option>
    <option>17.Júlia</option>
    <option>18.Noa</option>
    <option>19.Jana Ll</option>
    <option>24.Núria</option>
    <option>26.Mariona</option>
    <option>48.Clàudia</option>
    <option>Anònima</option>
  </select>

  <div class="step-label">Dia</div>
  <input type="date" id="dateInput">

  <div class="step-label">Com t'ha deixat l'entrenament?</div>
  <div class="mood-grid" id="moodGrid">
    <div class="mood-btn" data-val="Molt bé"><div class="emoji">😃</div><div class="lbl">Molt bé</div></div>
    <div class="mood-btn" data-val="Bé"><div class="emoji">🙂</div><div class="lbl">Bé</div></div>
    <div class="mood-btn" data-val="Normal"><div class="emoji">😐</div><div class="lbl">Normal</div></div>
    <div class="mood-btn" data-val="Cansada"><div class="emoji">😓</div><div class="lbl">Cansada</div></div>
    <div class="mood-btn" data-val="Molt cansada"><div class="emoji">🥵</div><div class="lbl">Molt cansada</div></div>
  </div>

  <div class="step-label">Vols afegir algun comentari? <span style="color:var(--text-dim); text-transform:none; letter-spacing:0;">(opcional)</span></div>
  <textarea id="commentInput" rows="3" placeholder="Escriu aquí el que vulguis..." style="width:100%; padding:14px; border-radius:12px; background:var(--bg-raised); border:1px solid var(--line); color:var(--text); font-family:'Inter',sans-serif; font-size:15px; resize:vertical;"></textarea>

  <button class="btn btn-primary" id="saveBtn" disabled>Enviar</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxhyiqFm5fV2TWiSgBb-keqqes7jmYDqIr40mSWb8uxuHU-jN8MTH0t7XHeRVe-Yg/exec";

  let selectedMood = null;
  const grid = document.getElementById('moodGrid');
  const saveBtn = document.getElementById('saveBtn');
  const playerSelect = document.getElementById('playerSelect');
  const dateInput = document.getElementById('dateInput');

  dateInput.valueAsDate = new Date();

  grid.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedMood = btn.dataset.val;
      grid.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      checkReady();
    });
  });
  playerSelect.addEventListener('change', checkReady);
  dateInput.addEventListener('change', checkReady);

  function checkReady(){
    saveBtn.disabled = !(playerSelect.value && dateInput.value && selectedMood);
  }

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(()=>{ t.style.display='none'; }, 2200);
  }

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Enviant...';
    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          type: 'feedback',
          data: dateInput.value,
          jugadora: playerSelect.value,
          cansament: selectedMood,
          comentari: document.getElementById('commentInput').value.trim()
        })
      });
      const result = await res.json();
      if (!result || !result.ok) throw new Error('sense ok');
      toast('Gràcies! Enviat ✓');
      setTimeout(() => { window.location.href = 'index.html'; }, 900);
    } catch(err){
      toast('Error en enviar, torna-ho a provar');
      saveBtn.disabled = false;
      saveBtn.textContent = 'Enviar';
    }
  });
</script>
</body>
</html>
