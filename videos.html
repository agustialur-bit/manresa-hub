<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vídeos nostres · Manresa</title>
<meta name="theme-color" content="#11141a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11141a; --bg-raised:#181c24; --bg-raised-2:#1e2330;
    --line:#2a2f3a; --pink:#ff2d78; --pink-dim:#c21f5c;
    --text:#f2f1ee; --text-dim:#8b93a3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; min-height:100dvh;
    padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }
  .wrap{width:100%; max-width:460px; margin:0 auto;}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
  .back-btn{
    width:38px; height:38px; border-radius:10px;
    background:var(--bg-raised); border:1px solid var(--line);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    text-decoration:none; flex:0 0 auto;
  }
  .topbar h1{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:22px;
    text-transform:uppercase; letter-spacing:.01em; margin:0;
  }

  .video-card{
    display:block; background:var(--bg-raised); border:1px solid var(--line);
    border-radius:14px; overflow:hidden; margin-bottom:14px;
    text-decoration:none; color:var(--text);
  }
  .video-card:active{background:var(--bg-raised-2);}
  .thumb{
    position:relative; width:100%; aspect-ratio:16/9; background:#000;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .play{
    position:absolute; width:52px; height:52px; border-radius:50%;
    background:rgba(17,20,26,.55); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid rgba(242,241,238,.5);
  }
  .thumb .play svg{width:20px; height:20px; fill:var(--text); margin-left:2px;}
  .thumb.no-img{background:rgba(255,45,120,.08);}
  .video-body{padding:14px 16px;}
  .video-title{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:15px;
    text-transform:uppercase; letter-spacing:.01em; margin-bottom:4px;
    line-height:1.3;
  }
  .video-date{font-size:12.5px; color:var(--text-dim);}

  .empty, .spinner{text-align:center; color:var(--text-dim); font-size:14px; padding:40px 10px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="back-btn" aria-label="Enrere">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>Vídeos nostres</h1>
  </div>

  <div id="videoList"><div class="spinner">Carregant...</div></div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxhyiqFm5fV2TWiSgBb-keqqes7jmYDqIr40mSWb8uxuHU-jN8MTH0t7XHeRVe-Yg/exec";

  /* --- Connexio amb el Sheet -----------------------------------------------
     El web app d'Apps Script respon 404 de manera intermitent quan rep
     peticions seguides. Per aixo cada crida es reintenta amb una espera
     creixent (mateix patró que la resta de pàgines de l'app).
     --------------------------------------------------------------------- */
  const ESPERES = [1200, 3000];
  const TEMPS_MAX = 9000;
  const dorm = (ms) => new Promise((r) => setTimeout(r, ms));

  async function fetchLimitat(opcions){
    const ctrl = new AbortController();
    const id = setTimeout(() => ctrl.abort(), TEMPS_MAX);
    try{
      return await fetch(API_URL, Object.assign({ signal: ctrl.signal }, opcions));
    } finally {
      clearTimeout(id);
    }
  }

  async function apiLlegeix(intents = 3){
    let ultimError;
    for (let i = 0; i < intents; i++){
      try{
        const res = await fetchLimitat({ cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return await res.json();
      } catch(err){
        ultimError = err;
        if (i < intents - 1) await dorm(ESPERES[Math.min(i, ESPERES.length - 1)]);
      }
    }
    throw ultimError;
  }

  function formatDisplayDate(str){
    if (!str) return '';
    if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
      const [y,m,dd] = str.split('-');
      return `${dd}/${m}/${y}`;
    }
    const d = new Date(str);
    if (isNaN(d)) return str;
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    return `${dd}/${mm}/${d.getFullYear()}`;
  }

  // Treu l'ID de vídeo de youtube.com/watch?v=, youtu.be/, /shorts/ i /embed/
  function ytThumb(url){
    try{
      const u = new URL(url);
      let id = null;
      if (u.hostname.includes('youtu.be')) id = u.pathname.slice(1);
      else if (u.searchParams.get('v')) id = u.searchParams.get('v');
      else {
        const m = u.pathname.match(/\/(shorts|embed)\/([^/?]+)/);
        if (m) id = m[2];
      }
      return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : null;
    } catch(e){ return null; }
  }

  const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

  async function carrega(){
    const list = document.getElementById('videoList');
    try{
      const data = await apiLlegeix();
      const videos = (data.videos || []).slice().sort((a,b) => new Date(b.data) - new Date(a.data));
      if (!videos.length){
        list.innerHTML = '<div class="empty">Encara no hi ha cap vídeo penjat.</div>';
        return;
      }
      list.innerHTML = '';
      videos.forEach(v => {
        const card = document.createElement('a');
        card.className = 'video-card';
        card.href = v.url;
        card.target = '_blank';
        card.rel = 'noopener';
        const thumb = ytThumb(v.url);
        card.innerHTML =
          `<div class="thumb${thumb ? '' : ' no-img'}">` +
            (thumb ? `<img src="${thumb}" alt="" loading="lazy">` : '') +
            `<div class="play">${playIcon}</div>` +
          `</div>` +
          `<div class="video-body">` +
            `<div class="video-title">${v.titol || 'Vídeo del partit'}</div>` +
            `<div class="video-date">${formatDisplayDate(v.data)}</div>` +
          `</div>`;
        list.appendChild(card);
      });
    } catch(err){
      list.innerHTML = '<div class="empty">No s\'ha pogut connectar amb la llista de vídeos.</div>';
    }
  }

  carrega();
</script>
</body>
</html>
