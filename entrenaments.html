<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrenaments · Manresa</title>
<meta name="theme-color" content="#11141a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#11141a; --bg-raised:#181c24; --bg-raised-2:#1e2330;
    --line:#2a2f3a; --pink:#ff2d78; --pink-dim:#c21f5c;
    --text:#f2f1ee; --text-dim:#8b93a3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh; min-height:100dvh;
    padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  }
  .wrap{width:100%; max-width:460px; margin:0 auto;}
  .topbar{display:flex; align-items:center; gap:12px; margin-bottom:22px;}
  .back-btn{
    width:38px; height:38px; border-radius:10px;
    background:var(--bg-raised); border:1px solid var(--line);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    text-decoration:none; flex:0 0 auto;
  }
  .topbar h1{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:22px;
    text-transform:uppercase; letter-spacing:.01em; margin:0;
  }

  .view{display:none;}
  .view.active{display:block;}

  /* ---- menu ---- */
  .menu-tile{
    display:flex; align-items:center; gap:16px;
    padding:20px 18px; background:var(--bg-raised);
    border:1px solid var(--line); border-radius:14px;
    margin-bottom:12px; cursor:pointer; position:relative; overflow:hidden;
  }
  .menu-tile::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--pink);}
  .menu-tile:active{background:var(--bg-raised-2);}
  .menu-tile .ic{
    width:44px; height:44px; border-radius:10px; flex:0 0 auto;
    background:rgba(255,45,120,.08); color:var(--pink);
    display:flex; align-items:center; justify-content:center;
  }
  .menu-tile .ic svg{width:22px; height:22px;}
  .menu-tile .tt{font-family:'Oswald',sans-serif; font-weight:600; font-size:16.5px; text-transform:uppercase;}
  .menu-tile .ts{font-size:13px; color:var(--text-dim); margin-top:2px;}
  .menu-tile .arrow{margin-left:auto; color:var(--text-dim); font-size:18px;}

  /* ---- shared step styling ---- */
  .step-label{
    font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--pink); margin:22px 0 10px;
  }
  .step-label:first-of-type{margin-top:6px;}

  input[type="date"], select, input[type="number"]{
    width:100%; padding:14px 14px; border-radius:12px;
    background:var(--bg-raised); border:1px solid var(--line);
    color:var(--text); font-family:'Inter',sans-serif; font-size:15px;
  }
  input[type="date"]{color-scheme:dark;}

  .concept-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:10px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--bg-raised); color:var(--text); font-size:13.5px;
    font-family:'Inter',sans-serif; cursor:pointer; user-select:none;
  }
  .chip.selected{background:var(--pink); border-color:var(--pink); color:#11141a; font-weight:600;}

  .entry-row{
    display:flex; align-items:center; gap:10px;
    padding:12px 14px; background:var(--bg-raised);
    border:1px solid var(--line); border-radius:12px; margin-bottom:8px;
  }
  .entry-row .name{flex:1; font-size:14px;}
  .entry-row .mins{color:var(--text-dim); font-size:13px;}
  .entry-row .rm{color:var(--text-dim); font-size:18px; padding:0 4px; cursor:pointer;}

  .btn{
    width:100%; padding:15px; border:none; border-radius:12px;
    font-family:'Oswald',sans-serif; font-weight:600; font-size:14px;
    letter-spacing:.06em; text-transform:uppercase; cursor:pointer;
    margin-top:16px;
  }
  .btn-primary{background:var(--pink); color:#11141a;}
  .btn-primary:disabled{background:var(--bg-raised-2); color:var(--text-dim);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text);}

  .empty{
    text-align:center; color:var(--text-dim); font-size:14px;
    padding:40px 10px;
  }

  .day-card{
    background:var(--bg-raised); border:1px solid var(--line);
    border-radius:14px; padding:16px 16px; margin-bottom:10px;
  }
  .day-card .day-title{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:15px;
    text-transform:uppercase; margin-bottom:10px; color:var(--text);
  }
  .day-card .concept-line{
    display:flex; justify-content:space-between; font-size:13.5px;
    padding:5px 0; border-top:1px solid var(--line);
  }
  .day-card .concept-line:first-of-type{border-top:none;}
  .day-card .concept-line .cn{color:var(--text);}
  .day-card .concept-line .mn{color:var(--pink); font-weight:600;}
  .day-card .day-total{
    margin-top:8px; padding-top:8px; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--text-dim); text-align:right;
  }

  .toast{
    position:fixed; left:20px; right:20px; bottom:28px;
    max-width:420px; margin:0 auto;
    background:var(--pink); color:#11141a; font-weight:600;
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.04em;
    text-align:center; padding:14px; border-radius:12px;
    display:none; text-transform:uppercase;
  }
  .spinner{text-align:center; color:var(--text-dim); font-size:13px; padding:20px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="index.html" class="back-btn" id="backBtn" aria-label="Enrere">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 id="pageTitle">Entrenaments</h1>
  </div>

  <!-- MENU -->
  <div class="view active" id="view-menu">
    <div class="menu-tile" onclick="goTo('registrar')">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
      <div>
        <div class="tt">Registrar entrenament</div>
        <div class="ts">Anota què i quant heu treballat avui</div>
      </div>
      <div class="arrow">›</div>
    </div>
    <div class="menu-tile" onclick="goTo('consultar')">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 3 5-8"/></svg></div>
      <div>
        <div class="tt">Consultar entrenaments</div>
        <div class="ts">Mira què vau entrenar cada dia</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </div>

  <!-- REGISTRAR -->
  <div class="view" id="view-registrar">
    <div class="step-label">Dia</div>
    <input type="date" id="dateInput">

    <div class="step-label">Conceptes d'avui</div>
    <div class="concept-grid" id="conceptGrid"></div>

    <div id="minutsBox" style="display:none;">
      <div class="step-label">Minuts — <span id="selectedConceptName"></span></div>
      <input type="number" id="minutsInput" placeholder="Minuts treballats" min="1" inputmode="numeric">
      <button class="btn btn-primary" onclick="addEntry()">Afegir a la sessió</button>
    </div>

    <div id="entriesBox" style="margin-top:20px;"></div>

    <button class="btn btn-primary" id="saveBtn" onclick="saveSession()" disabled>Desar entrenament</button>
    <button class="btn btn-ghost" onclick="goTo('menu')">Cancel·la</button>
  </div>

  <!-- CONSULTAR -->
  <div class="view" id="view-consultar">
    <div id="consultarList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // ⚠️ Un cop desplegat l'Apps Script, enganxa aquí la URL acabada en /exec
  const API_URL = "CONFIGURAR_URL_APPS_SCRIPT";

  let CONCEPTES = [];
  let sessionEntries = [];
  let pendingConcept = null;

  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(()=>{ t.style.display='none'; }, 2200);
  }

  function goTo(view){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+view).classList.add('active');
    document.getElementById('pageTitle').textContent =
      view === 'menu' ? 'Entrenaments' :
      view === 'registrar' ? 'Registrar' : 'Consultar';
    document.getElementById('backBtn').onclick = (e) => {
      if (view !== 'menu') { e.preventDefault(); goTo('menu'); }
    };
    if (view === 'registrar') resetRegistrar();
    if (view === 'consultar') loadConsultar();
  }

  function resetRegistrar(){
    sessionEntries = [];
    pendingConcept = null;
    document.getElementById('dateInput').valueAsDate = new Date();
    document.getElementById('minutsBox').style.display = 'none';
    document.getElementById('minutsInput').value = '';
    renderEntries();
    renderConceptGrid();
  }

  function renderConceptGrid(){
    const grid = document.getElementById('conceptGrid');
    grid.innerHTML = '';
    CONCEPTES.forEach(c => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = c;
      chip.onclick = () => {
        pendingConcept = c;
        document.getElementById('selectedConceptName').textContent = c;
        document.getElementById('minutsBox').style.display = 'block';
        document.getElementById('minutsInput').focus();
        [...grid.children].forEach(ch => ch.classList.remove('selected'));
        chip.classList.add('selected');
      };
      grid.appendChild(chip);
    });
  }

  function addEntry(){
    const mins = parseInt(document.getElementById('minutsInput').value, 10);
    if (!pendingConcept || !mins || mins <= 0) { toast('Falten dades'); return; }
    sessionEntries.push({ concepte: pendingConcept, minuts: mins });
    pendingConcept = null;
    document.getElementById('minutsBox').style.display = 'none';
    document.getElementById('minutsInput').value = '';
    [...document.getElementById('conceptGrid').children].forEach(ch => ch.classList.remove('selected'));
    renderEntries();
  }

  function removeEntry(i){
    sessionEntries.splice(i,1);
    renderEntries();
  }

  function renderEntries(){
    const box = document.getElementById('entriesBox');
    box.innerHTML = '';
    if (sessionEntries.length){
      const label = document.createElement('div');
      label.className = 'step-label';
      label.textContent = 'Sessió d\'avui';
      box.appendChild(label);
    }
    sessionEntries.forEach((e,i)=>{
      const row = document.createElement('div');
      row.className = 'entry-row';
      row.innerHTML = `<div class="name">${e.concepte}</div><div class="mins">${e.minuts} min</div><div class="rm" onclick="removeEntry(${i})">✕</div>`;
      box.appendChild(row);
    });
    document.getElementById('saveBtn').disabled = sessionEntries.length === 0;
  }

  async function saveSession(){
    const date = document.getElementById('dateInput').value;
    if (!date || sessionEntries.length === 0) return;
    const entries = sessionEntries.map(e => ({ data: date, concepte: e.concepte, minuts: e.minuts }));
    document.getElementById('saveBtn').disabled = true;
    document.getElementById('saveBtn').textContent = 'Desant...';
    try{
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' }, // evita preflight CORS amb Apps Script
        body: JSON.stringify({ entries })
      });
      toast('Entrenament desat ✓');
      setTimeout(()=>goTo('menu'), 800);
    } catch(err){
      toast('Error en desar');
      document.getElementById('saveBtn').disabled = false;
      document.getElementById('saveBtn').textContent = 'Desar entrenament';
    }
  }

  async function loadConsultar(){
    const list = document.getElementById('consultarList');
    list.innerHTML = '<div class="spinner">Carregant...</div>';
    try{
      const res = await fetch(API_URL);
      const data = await res.json();
      const byDate = {};
      (data.registres || []).forEach(r => {
        if (!byDate[r.data]) byDate[r.data] = [];
        byDate[r.data].push(r);
      });
      const dates = Object.keys(byDate).sort().reverse();
      if (!dates.length){
        list.innerHTML = '<div class="empty">Encara no hi ha cap entrenament registrat.</div>';
        return;
      }
      list.innerHTML = '';
      dates.forEach(d => {
        const items = byDate[d];
        const total = items.reduce((s,i)=>s+Number(i.minuts||0),0);
        const card = document.createElement('div');
        card.className = 'day-card';
        const [y,m,dd] = d.split('-');
        card.innerHTML = `<div class="day-title">${dd}/${m}/${y}</div>` +
          items.map(i => `<div class="concept-line"><span class="cn">${i.concepte}</span><span class="mn">${i.minuts} min</span></div>`).join('') +
          `<div class="day-total">Total: ${total} min</div>`;
        list.appendChild(card);
      });
    } catch(err){
      list.innerHTML = '<div class="empty">No s\'ha pogut connectar amb el registre.</div>';
    }
  }

  async function loadConceptes(){
    try{
      const res = await fetch(API_URL);
      const data = await res.json();
      CONCEPTES = data.conceptes && data.conceptes.length ? data.conceptes : CONCEPTES;
    } catch(err){ /* es fa servir la llista de reserva */ }
  }

  // llista de reserva per si encara no hi ha connexió configurada
  CONCEPTES = [
    "TIR","ATAC ZONA","DEFENSA P&R","DEFENSA INDIVIDUAL","DEFENSA ZONA",
    "AJUDES I ROTACIONS","TRANSICIÓ DEFENSIVA","SORTIDES DE PRESSIÓ",
    "TECNICA INDIVIDUAL","FINALITZACIONS","FÍSIC / PREVENCIÓ",
    "PRESSIÓ DEFENSIVA / DEFENSA A TOT CAMP"
  ];

  document.getElementById('backBtn').onclick = () => {};
  loadConceptes().then(renderConceptGrid);
  document.getElementById('dateInput').valueAsDate = new Date();
</script>
</body>
</html>
